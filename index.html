<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Time Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main class="container">
        <header>
            <h1>Meeting Time <span class="gradient-text">Planner</span></h1>
            <p>Coordinate across time zones seamlessly.</p>
        </header>

        <section class="card local-time-section">
            <h2>Your Local Time</h2>
            <div class="input-group">
                <div class="input-field">
                    <label for="local-date">Date</label>
                    <input type="date" id="local-date">
                </div>
                <div class="input-field">
                    <label for="local-time">Time</label>
                    <input type="time" id="local-time">
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-top: 0.5rem;">
                <p class="timezone-info" id="local-tz-info">Detected: <span id="detected-tz">Loading...</span></p>
                <p class="dst-warning">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; margin-bottom: 2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    Pick the exact date to auto-adjust for Daylight Saving Time.
                </p>
            </div>
        </section>

        <section class="card add-timezone-section">
            <h2>Add Region/Country/City</h2>
            
            <div class="search-container" style="margin-bottom: 1.5rem;">
                <input type="text" id="smart-search" placeholder="Smart Search: Type any city in the world..." autocomplete="off">
                <ul class="dropdown" id="smart-dropdown" hidden></ul>
            </div>

            <div style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.85rem; letter-spacing: 1px;">OR BROWSE BY CONTINENT</div>

            <div class="input-group" style="margin-bottom: 0.5rem;">
                <div class="input-field">
                    <label>Continent</label>
                    <select id="sel-continent">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="input-field">
                    <label>Country</label>
                    <select id="sel-country">
                        <option value="">All</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <div class="input-field">
                    <label>City / Region</label>
                    <select id="sel-city">
                        <option value="">Select a city...</option>
                    </select>
                </div>
            </div>
            <button id="btn-add" class="add-btn" disabled>Add to Planner</button>
        </section>

        <section class="results-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="margin-bottom: 0;">Participants' Times</h2>
                <button id="btn-copy" class="action-btn" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy Schedule
                </button>
            </div>
            <div id="target-list" class="target-list">
                <!-- Target timezone cards will be injected here -->
            </div>
        </section>
    </main>

    <script src="data.js?v=9"></script>
    <script src="app.js?v=9"></script>
</body>
</html>
